<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="10%" r="140%">
      <stop offset="0" stop-color="#7c1231"/>
      <stop offset=".45" stop-color="#54091a"/>
      <stop offset="1" stop-color="#2a040c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e3b3"/>
      <stop offset=".5" stop-color="#c9a02c"/>
      <stop offset="1" stop-color="#8f6a1a"/>
    </linearGradient>
    <linearGradient id="goldsoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8cf85"/>
      <stop offset="1" stop-color="#b8892a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="840" fill="url(#bg)"/>

  <!-- watermark arcs -->
  <g stroke="url(#goldsoft)" fill="none" opacity=".10">
    <circle cx="300" cy="420" r="270" stroke-width="1.2"/>
    <circle cx="300" cy="420" r="240" stroke-width="1" stroke-dasharray="2 8"/>
  </g>

  <!-- frame + corner points -->
  <rect x="24" y="24" width="552" height="792" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="36" y="36" width="528" height="768" fill="none" stroke="#c9a02c" stroke-opacity=".45" stroke-width="1"/>
  <g fill="#c9a02c">
    <circle cx="24" cy="24" r="4"/><circle cx="576" cy="24" r="4"/>
    <circle cx="576" cy="816" r="4"/><circle cx="24" cy="816" r="4"/>
  </g>

  <!-- top: single mandala + PRODUCT RANGE -->
  <g transform="translate(300,120) scale(.5)" stroke="#c9a02c" fill="none">
    <circle r="52" stroke-width="2.2"/>
    <circle r="38" stroke-width="1.1" stroke-dasharray="3 6"/>
    <circle r="14" stroke-width="2.2"/>
    <path d="M0 -60v12M0 60v-12M-60 0h12M60 0h-12" stroke-width="2.2"/>
  </g>
  <text x="300" y="206" text-anchor="middle" font-size="23" font-style="italic" letter-spacing="1.5" fill="#e8cf85">Crafted for Every Table</text>

  <!-- medallion, generous space -->
  <g>
    <circle cx="300" cy="408" r="126" fill="#430714" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="300" cy="408" r="111" fill="none" stroke="#c9a02c" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 6"/>
    <g stroke="url(#gold)" fill="none">
      <circle cx="300" cy="408" r="77" stroke-width="1.4"/>
      <g stroke-width="1.5">
        <path d="M300 348c-19 12-19 28 0 38 19-10 19-26 0-38z"/>
        <path d="M300 468c19-12 19-28 0-38-19 10-19 26 0 38z"/>
        <path d="M240 408c12-19 28-19 38 0-10 19-26 19-38 0z"/>
        <path d="M360 408c-12 19-28 19-38 0 10-19 26-19 38 0z"/>
        <path d="M261 369c14-10 30-5 33 12-14 10-30 5-33-12z"/>
        <path d="M339 447c-14 10-30 5-33-12 14-10 30-5 33 12z"/>
        <path d="M261 447c14 10 30 5 33-12-14-10-30-5-33 12z"/>
        <path d="M339 369c-14-10-30-5-33 12 14 10 30 5 33-12z"/>
      </g>
      <circle cx="300" cy="408" r="27" stroke-width="1.6"/>
      <circle cx="300" cy="408" r="9" stroke-width="2"/>
      <circle cx="300" cy="408" r="3" fill="#c9a02c" stroke="none"/>
    </g>
  </g>

  <!-- airy product lines -->
  <text x="300" y="596" text-anchor="middle" font-size="19" font-style="italic" letter-spacing="1" fill="#e8cf85">Dinner Sets &amp; Pooja Thalis</text>
  <text x="300" y="634" text-anchor="middle" font-size="19" font-style="italic" letter-spacing="1" fill="#e8cf85">Glassware &amp; Corporate Gifting</text>

  <!-- bottom flourish + title -->
  <g stroke="#c9a02c" stroke-width="1" opacity=".85">
    <line x1="206" y1="712" x2="282" y2="712"/>
    <line x1="318" y1="712" x2="394" y2="712"/>
  </g>
  <rect x="295" y="707" width="10" height="10" transform="rotate(45 300 712)" fill="#c9a02c"/>
  <text x="300" y="762" text-anchor="middle" font-size="24" font-style="italic" fill="#f3e3b3" letter-spacing="1">Catalogue Library</text>
</svg>
